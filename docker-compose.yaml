services:
  autoledger-app-test-helper:
    build:
      context: .
      dockerfile: ./dockerfile
    image: autoledger-app-test:local
    ulimits:
      nofile:
        soft: 10000
        hard: 100000
      nproc: 1024

    container_name: autoledger-app-test-container

    network_mode: "bridge"

    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${SOURCE_CODE_DIR:-./src}:/autoledger/src
      - ${TESTS_CODE_DIR:-./tests}:/autoledger/tests
    restart: unless-stopped
